          A.mix(0.45, 0, 2);                       // baja el ambiente para que la voz se entienda
        }
        if (v.start >= 0 && t >= v.end && !v.done) { v.done = true; A.mix(0.9, 0, 3); }
        // Lluvia desde el inicio (aparece en ~4 s).
        this.rain.material.uniforms.uRain.value = 0.85 * smooth(0, 4, t);
        // Barbas colgantes y manchas de liquen aparecen entre los 4,5 y 18,5 s.
        this.famU('barbs').uGrow.value = smooth(4.5, 18.5, t);
        this.lu.uReveal.value = smooth(4.5, 18.5, t);
        // Al terminar la voz (o a los 29,5 s si no cargó) se pueden activar y aparece la indicación.
        const vEnd = v.start >= 0 ? v.end : 29.5;
        const selectable = t > vEnd && this.selectedLichen < 0;
        this.lu.uSelectable.value = selectable ? 1 : 0;
        this.lichenProxies.visible = selectable;
        approach(this.s1TextAlpha, selectable ? 1 : 0, 3, dt);
        this.s1Text.visible = this.s1TextAlpha.value > 0.01;
        this.s1Text.material.opacity = this.s1TextAlpha.value * 0.9;
        if (this.s1Text.visible) {
          this.s1Text.position.copy(this.camPos).addScaledVector(new V3(this.fwd.x, 0, this.fwd.z).normalize(), 1.3).setY(this.camPos.y - 0.25);
          this.s1Text.lookAt(this.camPos);
        }
        // Si nadie selecciona un liquen, se elige solo a los 44,5 s.
        if (this.selectedLichen < 0 && t >= Math.min(vEnd + 15, CONFIG.s1AutoMax)) this.selectLichen(this.frontLichen());
        if (this.selectedLichen >= 0) {
          const k = clamp01((t - this.selectTime) / 3);
          this.lu.uSelAmt.value = smooth(0, 1, k);
          this.forestDim(lerp(1, 0.04, smooth(0, 1, k)));
          fogTo(STATE_FOG.dive, dt, 2);
          if (k >= 1) this.goTo(1);
        } else fogTo(STATE_FOG.forest, dt);
      },
      exit: () => { this.muted = false; this.lichenProxies.visible = false; this.lu.uSelectable.value = 0; this.s1Text.visible = false; this.s1TextAlpha.value = 0; this.famU('barbs').uGrow.value = 1; },
      auto: false,
    };

    /* ESTADO 2 — ENCUENTRO: crecen → pulso de luz → puente de comunicación → unión → un solo organismo */
    const s2 = {
      enter: () => {
        this.readCamera(); this.recenter();
        this.hideAllLayers();
        this.zoom = this.zoomT = 1;
        this.symRoot.visible = true; placeSym(-1.3, 1.15);
        this.symRot = {yaw: 0, pitch: 0, tYaw: 0, tPitch: 0};
        S.algae.scale.setScalar(1);
        A.mix(0, 0.75); A.synth.setMode('encounter');
        A.playNarr(N.a02);
      },
      update: (t, dt) => {
        fogTo(STATE_FOG.abstract, dt, 3);
        S.u.uAlpha.value = smooth(0, 2, t);
        S.uIn.value = smooth(0.5, 4, t);
        // Crecimiento por separado (1–9 s).
        S.u.uGrow.value = t < 16.5 ? 0.45 * smooth(1, 9, t) : lerp(0.5, 1.0, smooth(16.5, 24, t));
        // Pulso de luz: primero el hongo (9–10.5 s), luego el alga (10.5–12 s).
        S.u.uPulse.value = t > 9 && t < 10.6 ? (t - 9) / 1.5 * 0.46 : -1;
        S.uFlash.value = t > 10.5 && t < 12.5 ? Math.sin((t - 10.5) / 2 * Math.PI) : 0;
        // Puente de comunicación (12–15.5 s) que se apaga durante la unión (16–19 s).
        S.ub.uBridge.value = smooth(12, 15.5, t);
        S.ub.uAlpha.value = smooth(12, 12.5, t) * (1 - smooth(16, 19, t));
        // Unión: el alga se acerca y el grupo se compacta hasta parecer un solo cuerpo.
        const k = smooth(16, 20, t);
        S.algae.position.set(lerp(0.32, 0, k), 0.03 * Math.sin(t * 0.6) * (1 - k), 0);
        S.algae.scale.setScalar(lerp(1, 0.85, smooth(18, 24, t)));
        S.u.uMerge.value = smooth(20, 26, t) * 0.7;
        this.sym.group.rotation.set(0, 0.2 * Math.sin(t * 0.12) + 0.04 * Math.max(0, t - 20), 0);
        this.sym.group.scale.setScalar(1.15 * this.zoom);
      },
      auto: true,
    };

    /* ESTADO 3 — INTIMIDAD CELULAR */
    const s3 = {
      enter: (from) => {
        if (from !== 1) { this.readCamera(); this.recenter(); }
        this.hideAllLayers();
        this.symRoot.visible = true;
        S.u.uGrow.value = 1; S.u.uPulse.value = -1; S.ub.uAlpha.value = 0; S.uFlash.value = 0;
        S.u.uAlpha.value = Math.max(S.u.uAlpha.value, 0.3); S.uIn.value = Math.max(S.uIn.value, 0.5);
        S.algae.position.set(0, 0, 0); S.algae.scale.setScalar(0.85);
        if (from !== 1) this.zoom = this.zoomT = 1;
        this.symScale0 = from === 1 ? this.sym.group.scale.x / this.zoom : 1.15; this.symZ0 = from === 1 ? this.symRoot.position.z : -1.3;
        this.symRot.tYaw = this.symRot.yaw = this.sym.group.rotation.y; this.symRot.tPitch = this.symRot.pitch = 0;
        this.cellProxy.visible = true;
        this.hintDone = false;
        A.mix(0, 0.75); A.synth.setMode('cellular');
        A.playNarr(N.a03);   // no se reinicia si aún suena
      },
      update: (t, dt) => {
        fogTo(STATE_FOG.abstract, dt, 3);
        approach(S.u.uAlpha, 1, 2, dt); approach(S.uIn, 1, 2, dt);
        S.u.uMerge.value = lerp(S.u.uMerge.value, 0.55, 1 - Math.exp(-dt));
        const k = smooth(0, 2.5, t), scale = lerp(this.symScale0, 1.8, k);
        placeSym(lerp(this.symZ0, -1.2, k), scale);
        this.cellProxy.scale.setScalar(scale * this.zoom);
        if (!this.manip) this.symRot.tYaw += dt * 0.06;
        this.symRot.yaw = lerp(this.symRot.yaw, this.symRot.tYaw, 1 - Math.exp(-8 * dt));
        this.symRot.pitch = lerp(this.symRot.pitch, this.symRot.tPitch, 1 - Math.exp(-8 * dt));
        this.sym.group.rotation.set(this.symRot.pitch, this.symRot.yaw, 0, 'YXZ');
        const want = t > 1 && t < 9 && !this.hintDone ? 1 : 0;
        approach(this.hintAlpha, want, 4, dt);
        this.hint.visible = this.hintAlpha.value > 0.01;
        this.hint.material.opacity = this.hintAlpha.value * 0.9;
        if (this.hint.visible) {
          this.hint.position.set(0, this.eyeY - 0.55, -0.95).applyMatrix4(this.world.matrixWorld);
          this.hint.lookAt(this.camPos);
        }
      },
      exit: () => { this.endManip(); this.cellProxy.visible = false; this.hint.visible = false; this.hintAlpha.value = 0; },
      auto: true,
    };

    /* ESTADO 4 — ROCA MADRE Y CRECIMIENTO
     * 0–12 s  liquen desciende; colonias se extienden en la roca y luego en el suelo
     * 12–22 s gatillo (o automático a los 16 s): "sopla fuerte" → ~1 s → esporas
     * →40 s   tiempo geológico: hierbas pioneras y flores → helechos → árboles y liquen colgante
     * 40–50 s fauna */
    const s4 = {
      enter: (from) => {
        this.readCamera(); this.recenter();
        this.hideAllLayers();
        this.symRoot.visible = from === 2;
        this.setForest(false, 0); this.forestDim(1);
        this.fam.dust.visible = true; this.famU('dust').uGrow.value = 1;   // el polvo mineral siempre está
        this.lichen.visible = false;
        this.rock.group.visible = true; this.groundCol.visible = true; this.lichenBody.visible = true; this.spores.visible = true;
        Object.values(this.fauna).forEach((m) => (m.visible = true)); this.setFaunaScale(0);
        this.rock.colonies.material.uniforms.uGrow.value = 0; this.groundCol.material.uniforms.uGrow.value = 0;
        this.setRockAlpha(0); this.setLichenBodyAlpha(0);
        const su = this.spores.material.uniforms; su.uDisp.value = 0; su.uAlpha.value = 0; su.uBreath.value = 0;
        this.spore = {at: -1};
        this.flags4 = {};
        A.mix(0, 0.75); A.synth.setMode('rock');
        A.playNarr(N.a04);
        this.tlAlpha.value = 0;
      },
      update: (t, dt) => {
        fogTo(t < 22 ? STATE_FOG.rock : STATE_FOG.grown, dt, 1);
        if (this.symRoot.visible) {   // el simbionte se aleja de la escala celular y se vuelve el talo completo
          const k = smooth(0, 3, t);
          this.symRoot.position.set(lerp(0, ROCK_TOP.x, k), lerp(this.eyeY - 0.1, 1.9, k), lerp(-1.2, ROCK_TOP.z, k));
          this.sym.group.scale.setScalar(lerp(1.8, 0.2, k));
          S.u.uAlpha.value = 1 - k;
          if (k >= 1) this.symRoot.visible = false;
        }
        // Roca y descenso del liquen; reacción de luz al contacto (4.5 s).
        const flash = t > 4.5 ? Math.exp(-(t - 4.5) * 1.8) : 0;
        this.setRockAlpha(smooth(0, 2.5, t) * (1 + flash * 1.5));
        this.setLichenBodyAlpha(smooth(1.5, 3, t));
        this.lichenBody.position.set(ROCK_TOP.x, lerp(1.9, ROCK_TOP.y, smooth(2, 4.5, t)), ROCK_TOP.z);
        this.lichenBody.rotation.y = t * 0.05;
        // Colonias: primero sobre la roca, después en el suelo.
        this.rock.colonies.material.uniforms.uGrow.value = smooth(4.5, 10, t);
        this.groundCol.material.uniforms.uGrow.value = smooth(7, 13, t);
        // Esporas: flotan sobre el liquen; desde los 6 s "respiran" esperando el gatillo.
        // "Sopla fuerte" suena al pulsar (o solo a los 9 s) y la dispersión nunca empieza antes de los 10 s.
        const su = this.spores.material.uniforms;
        if (this.spore.at < 0 && t >= 9) this.triggerSpores();           // automático si nadie pulsa
        su.uBreath.value = t >= 6 && this.spore.at < 0 ? 1 : 0;
        const sa = this.spore.at;
        su.uDisp.value = sa > 0 ? smooth(sa, sa + 8, t) : 0;
        su.uAlpha.value = smooth(5, 7, t) * (sa > 0 ? 1 - smooth(sa + 9, sa + 14, t) : 1);
        // Tiempo geológico: la vegetación brota cuando las esporas se asientan.
        const g0 = sa > 0 ? sa + 4 : 999;
        const geo = clamp01((t - g0) / Math.max(1, 34 - g0));
        for (const [k, [a, b]] of Object.entries(GEO_RANGE)) {
          const v = clamp01((geo - a) / (b - a));
          this.famU(k).uGrow.value = v;
          this.fam[k].visible = v > 0 && !(k === 'ferns' && this.quality >= 2);
        }
        // Fauna (34–45 s), aparición gradual y discreta, con el bosque ya maduro.
        if (t >= 34 && !this.flags4.d) { this.flags4.d = true; A.playNarr(N.a06); }
        const order = [['chucao', 34], ['ciervo', 36], ['ranita', 38]];
        for (const [k, t0] of order) { const m = this.fauna[k]; m.scale.setScalar(Math.max(0.0001, smooth(t0, t0 + 3, t) * m.userData.baseScale)); }
        this.animateFauna(t);
      },
      exit: () => { this.tlAlpha.value = 0; this.applyTimelineAlpha(0); this.symRoot.visible = false; },
      auto: true,
    };

    /* ESTADO 5 — RED INTERCONECTADA (+ lluvia y regreso al origen) */
    const s5 = {
      enter: (from) => {
        this.hideAllLayers();
        this.setForest(true); this.forestDim(1);
        this.lichen.visible = true; this.lu.uReveal.value = 1; this.lu.uSelAmt.value = 0; this.lu.uSel.value = -1;
        this.rock.group.visible = true; this.groundCol.visible = true; this.lichenBody.visible = true;
        this.rock.colonies.material.uniforms.uGrow.value = 1; this.groundCol.material.uniforms.uGrow.value = 1;
        this.lichenBody.position.copy(ROCK_TOP);
        Object.values(this.fauna).forEach((m) => (m.visible = true));
        this.net.lines.visible = this.net.flow.visible = true; this.net.u.uReveal.value = 0; this.net.u.uAlpha.value = 1;
        this.rain.visible = true; this.rain.material.uniforms.uRain.value = 0; this.rain.material.uniforms.uAlpha.value = 0.55;
        if (this.sky) { this.sky.visible = true; this.sky.material.uniforms.uAlpha.value = 0; }
        this.flags5 = {}; this.from5 = from;
        A.mix(0, 0.75); A.synth.setMode('network');
        A.playNarr(N.a07);
      },
      update: (t, dt) => {
        for (const k of FOREST_FAMS) approach(this.famU(k).uGrow, 1, 1.5, dt);
        const back = smooth(25, 33.5, t);    // regreso al bosque presente
        this.net.u.uReveal.value = smooth(1, 14, t);
        this.net.u.uAlpha.value = 1 - back;
        this.rain.material.uniforms.uRain.value = smooth(3, 20, t) * (1 - back);
        if (this.sky) this.sky.material.uniforms.uAlpha.value = 0.38 * smooth(0, 8, t) * (1 - back);
        fogTo(back > 0 ? STATE_FOG.forest : STATE_FOG.network, dt, 1);
        if (t >= 12 && !this.flags5.x) { this.flags5.x = true; A.mix(0.9, 0, 5); }   // música → ambiente del bosque
        const appear = this.from5 === 3 ? 1 : smooth(0, 3, t);
        const keep = Math.min(appear, 1 - smooth(25, 33, t));
        this.setRockAlpha(keep); this.setLichenBodyAlpha(keep); this.setFaunaScale(keep);
        this.rock.group.visible = this.groundCol.visible = keep > 0.01;
        this.animateFauna(t);
        if (t >= CONFIG.durations[4]) this.goTo(0);
      },
      exit: () => { if (this.sky) this.sky.visible = false; },
      auto: false,
    };
    return [s1, s2, s3, s4, s5];
  }

  frontLichen() {
    let best = 0, bestDot = -2; const w = new V3();
    this.lichenCenters.forEach((c, i) => {
      w.copy(c).applyMatrix4(this.world.matrixWorld).sub(this.camPos).normalize();
      const d = w.dot(this.fwd); if (d > bestDot) { bestDot = d; best = i; }
    });
    return best;
  }
  selectLichen(i) {
    if (this.cur !== 0 || this.selectedLichen >= 0) return;   // evita repeticiones
    this.selectedLichen = i; this.selectTime = this.t;
    this.lu.uSel.value = i;
    this.lichenProxies.visible = false;
    this.audio.playNarr(N.a01);
    this.audio.synth.oneShotOrigin();
    this.audio.mix(0, 0.75, 5);   // crossfade ≤ 5 s bosque → sintetizador
  }
  // Gatillo de la escena 4: primero el audio "sopla fuerte", luego (≈1 s) la dispersión de esporas.
  triggerSpores() {
    if (this.cur !== 3 || this.spore.at > 0) return;
    this.audio.playNarr(N.a05);
    this.spore.at = Math.max(this.t + 1.0, 10);
  }

  animateFauna(t) {
    const c = this.fauna.chucao, b = this.fauna.ciervo, r = this.fauna.ranita;
    c.position.y = FAUNA_POS.chucao.y + Math.max(0, Math.sin(t * 2.2)) * 0.04 * (Math.sin(t * 0.7) > 0.6 ? 1 : 0);
    b.rotation.y = Math.atan2(-FAUNA_POS.ciervo.x, -FAUNA_POS.ciervo.z) + Math.sin(t * 0.4) * 0.3;
    r.scale.y = r.scale.x * (1 + 0.06 * Math.max(0, Math.sin(t * 5)));
  }

  updateTimeline(pos, t, dt) {
    approach(this.tlAlpha, 1, 3, dt);
    this.applyTimelineAlpha(this.tlAlpha.value);
    const x = -0.3 + 0.6 * pos;
    this.tlMarker.position.set(x, 0, 0.001);
    this.tlFill.scale.x = Math.max(0.0001, pos); this.tlFill.position.x = -0.3 + 0.3 * pos;
    this.tlNow.position.x = x;
    this.tlLabelClock -= dt;
    if (this.tlLabelClock <= 0) {   // máx. 10 redibujos/s
      this.tlLabelClock = 0.1;
      const ma = 400 * (1 - pos);
      let txt;
      if (pos >= 0.9995 || t >= 49.7) txt = 'HOY';
      else if (ma >= 10) txt = `${Math.round(ma)} MA`;
      else if (ma >= 0.1) txt = `${ma.toFixed(1).replace('.', ',')} MA`;
      else txt = `${ma.toFixed(2).replace('.', ',')} MA`;
      this.tlNow.setText(txt);
    }
  }
  applyTimelineAlpha(a) { this.tlMats.forEach((m, i) => (m.opacity = a * (i === 0 ? 0.5 : i < 3 ? 0.8 : 1))); this.timeline.visible = a > 0.01; }

  /* ---------- interacción ---------- */
  actionOf(obj) { for (let o = obj; o; o = o.parent) if (o.userData?.action) return o; return null; }
  // Las flechas tienen prioridad: si el rayo del mando las cruza, se navega aunque delante haya otro
  // volumen interactivo (p. ej., la estructura celular, que es grande y quedaba entre el usuario y las flechas).
  navUnderRay(source) {
    const ci = xb.user.controllers?.indexOf(source?.controller) ?? -1;
    if (ci < 0) return null;
    const ray = xb.user.getRay(ci, this.tmpRay);
    let best = null, bd = Infinity;
    for (const [a, {g}] of Object.entries(this.navBtns)) {
      g.getWorldPosition(this._navC ||= new V3());
      (this._navS ||= new THREE.Sphere()).set(this._navC, 0.05);
      const p = ray.intersectSphere(this._navS, this._navP ||= new V3());
      if (p) { const d = p.distanceTo(ray.origin); if (d < bd) { bd = d; best = a; } }
    }
    return best;
  }
  // event.target es el Script que recibe el evento; la superficie golpeada es event.surface.
  onObjectSelectStart(event) {
    if (!this.running) return;
    const navA = this.nav.visible ? this.navUnderRay(event.source) : null;
    if (navA) { event.stopPropagation(); this.flashNav(navA); this.navigate(navA === 'next' ? 1 : -1); return; }
    const o = this.actionOf(event.surface || event.intersection?.object);
    if (!o) return;
    event.stopPropagation();
    const a = o.userData.action;
    if (a === 'next') { this.flashNav(a); this.navigate(1); }
    else if (a === 'prev') { this.flashNav(a); this.navigate(-1); }
    else if (a === 'lichen' && this.cur === 0 && this.lichenProxies.visible) this.selectLichen(o.userData.index);
    else if (a === 'cell' && this.cur === 2) { if (this.manip) this.endManip(); else this.startManip(event.source); }
  }
  // Gatillo "libre" (sin apuntar a un control): activa las esporas en la escena 4.
  onSelectStart(event) {
    if (!this.running || this.cur !== 3 || this.t < 6 || this.t >= 10) return;
    const o = this.actionOf(event?.surface || event?.intersection?.object);
    if (o && (o.userData.action === 'next' || o.userData.action === 'prev')) return;
    if (event?.source && this.navUnderRay(event.source)) return;
    this.triggerSpores();
  }
  // Destello breve de la flecha pulsada (confirma qué control se activó).
  flashNav(a) { const b = this.navBtns[a]; if (b) b.flash = 1; }
  updateNavFeedback(dt) {
    // Resaltado por rayo propio (funciona aunque otro volumen intercepte el rayo antes que la flecha).
    const hovered = new Set();
    for (const c of xb.user.controllers || []) { const a = this.navUnderRay({controller: c}); if (a) hovered.add(a); }
    for (const [a, b] of Object.entries(this.navBtns)) {
      b.flash = Math.max(0, (b.flash || 0) - dt * 3);
      const h = hovered.has(a) ? 1 : 0;
      b.g.scale.setScalar(1 + 0.35 * h + 0.3 * b.flash);
      b.icon.material.opacity = 0.45 + 0.45 * h + 0.5 * b.flash;
    }
  }
  onHoverEnter(event) {
    const o = this.actionOf(event.surface || event.intersection?.object); if (!o) return;
    const a = o.userData.action;
    if (a === 'lichen') this.lu.uHover.value = o.userData.index;

  }
  onHoverExit(event) {
    const o = this.actionOf(event.surface || event.intersection?.object); if (!o) return;
    const a = o.userData.action;
    if (a === 'lichen') this.lu.uHover.value = -1;

  }
  onSqueezeStart() { if (this.manip) this.endManip(); }   // control de salida de la manipulación
  onKeyDown(event) {
    if (event.code === 'ArrowRight') this.navigate(1);
    else if (event.code === 'ArrowLeft') this.navigate(-1);
    else if (event.code === 'Escape' && this.manip) this.endManip();
    else if (event.code === 'Space') this.onSelectStart({});
    else if (event.code === 'Equal' || event.code === 'NumpadAdd') this.zoomT = Math.min(2.0, this.zoomT * 1.15);
    else if (event.code === 'Minus' || event.code === 'NumpadSubtract') this.zoomT = Math.max(0.5, this.zoomT / 1.15);
  }

  rayAngles(ci) {
    const ray = xb.user.getRay(ci, this.tmpRay); const d = ray.direction;
    if (d.lengthSq() < 0.5) return null;
    return [Math.atan2(d.x, -d.z), Math.asin(THREE.MathUtils.clamp(d.y, -1, 1))];
  }
  startManip(source) {
    const ci = xb.user.controllers?.indexOf(source?.controller) ?? -1;
    const ang = ci >= 0 ? this.rayAngles(ci) : null;
    if (!ang) return;
    this.manip = {ci, last: ang};
    this.hintDone = true;
  }
  endManip() { this.manip = null; }
  updateManip() {
    if (!this.manip) return;
    const ang = this.rayAngles(this.manip.ci);
    if (!ang) return;
    const wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));
    const dy = THREE.MathUtils.clamp(wrap(ang[0] - this.manip.last[0]), -0.15, 0.15);
    const dp = THREE.MathUtils.clamp(ang[1] - this.manip.last[1], -0.15, 0.15);
    this.manip.last = ang;
    this.symRot.tYaw += dy * 2.5;
    this.symRot.tPitch = THREE.MathUtils.clamp(this.symRot.tPitch - dp * 2.5, -1.1, 1.1);   // límites estables
  }

  // Botones A/X = avanzar, B/Y = retroceder, joystick izq./der. (API WebXR estándar).
  pollGamepads() {
    const session = xb.core.renderer?.xr?.getSession?.();
    let stickY = 0;
    if (session) for (const src of session.inputSources) {
      const gp = src.gamepad; if (!gp) continue;
      const prev = this.padPrev.get(src) || {a: false, b: false, stick: 0};
      const a = !!gp.buttons[4]?.pressed, b = !!gp.buttons[5]?.pressed;
      const x = gp.axes.length > 2 ? gp.axes[2] : 0, y = gp.axes.length > 3 ? gp.axes[3] : 0;
      if (Math.abs(y) > 0.2 && Math.abs(y) > Math.abs(x)) stickY = y;     // arriba/abajo: acercar/alejar
      const stick = x > 0.75 ? 1 : x < -0.75 ? -1 : (Math.abs(x) < 0.3 ? 0 : prev.stick);
      if (a && !prev.a) this.navigate(1);
      if (b && !prev.b) this.navigate(-1);
      if (stick !== 0 && stick !== prev.stick) this.navigate(stick);
      this.padPrev.set(src, {a, b, stick});
    }
    this.stickY = stickY;
  }

  // Acercar/alejar las estructuras micro (escenas 2 y 3): joystick arriba = acercar; teclas + / − en escritorio.
  updateZoom(dt) {
    if (this.cur !== 1 && this.cur !== 2) return;
    if (this.stickY) this.zoomT = THREE.MathUtils.clamp(this.zoomT * Math.exp(-this.stickY * dt * 1.4), 0.5, 2.0);
    this.zoom = lerp(this.zoom, this.zoomT, 1 - Math.exp(-6 * dt));
  }

  followHud(dt) {
    const yaw = this.camYaw();
    const d = Math.atan2(Math.sin(yaw - this.hudYaw), Math.cos(yaw - this.hudYaw));
    if (Math.abs(d) > 0.5 || this.hudCatch) { this.hudCatch = Math.abs(d) > 0.05; this.hudYaw += d * (1 - Math.exp(-4 * dt)); }
    for (const g of [this.hud, this.nav]) { g.position.copy(this.camPos); g.rotation.set(0, this.hudYaw, 0); }
  }

  // Degradación visual si el rendimiento cae (se conserva lo narrativo esencial).
  monitor(dt) {
    this.dtAvg = lerp(this.dtAvg, dt, 0.05);
    if (this.dtAvg > 1 / 55) this.slowTime += dt; else this.slowTime = Math.max(0, this.slowTime - dt * 0.5);
    if (this.slowTime > 3 && this.quality < 2) {
      this.quality++; this.slowTime = 0;
      const f = this.quality === 1 ? 0.6 : 0.35;
      for (const o of [this.spores, this.net.flow, this.fam.dust, this.fam.moss, this.rain]) {
        const c = o.geometry.attributes.position.count; o.geometry.setDrawRange(0, Math.floor(c * f) & ~1);
      }
      if (this.quality === 2) this.fam.ferns.visible = false;
      console.info('[LIQUEN] Calidad reducida a nivel', this.quality);
    }
  }

  update() {
    const now = performance.now() / 1000;
    const dt = Math.min(0.25, Math.max(0, now - this.last)); this.last = now;
    U.uTime.value += dt;
    const r = xb.core.renderer;
    if (r?.xr?.isPresenting) {
      const l = r.xr.getBaseLayer?.();
      U.uScale.value = (l?.framebufferHeight || l?.textureHeight || 1700) / 2;
    } else if (r?.domElement) U.uScale.value = r.domElement.height / 2;
    if (!this.running) return;
    this.readCamera();
    if (this.pendingRecenter > 0 && --this.pendingRecenter === 0) this.recenter();
    this.followHud(dt);
    this.backdrop.position.copy(this.camPos);
    if (this.nav.visible) this.updateNavFeedback(dt);
    this.pollGamepads();
    this.updateZoom(dt);
    this.updateManip();
    this.t += dt;
    const st = this.states[this.cur];
    st.update(this.t, dt);
    if (st.auto && this.t >= CONFIG.durations[this.cur]) this.goTo(this.cur + 1);
    approach(U.uGlobal, 1, 2.2, dt);           // fundido desde negro
    xb.core.scene.background = (this.bg ||= new THREE.Color(0x000000));
    this.audio.synth.tick(this.t);
    this.monitor(dt);
  }
}

/* =====================================================================
 * 7. ARRANQUE (robusto en Meta Quest Browser)
 * ===================================================================== */
const landing = document.getElementById('landing');
const startBtn = document.getElementById('start');

/* --- Diagnóstico opcional: solo con ?debug en la URL (no añade texto en el modo normal) --- */
const DEBUG = new URLSearchParams(location.search).has('debug');
let debugBox = null;
if (DEBUG) {
  debugBox = document.createElement('pre');
  debugBox.style.cssText = 'position:fixed;right:12px;bottom:12px;z-index:50;max-width:min(560px,90vw);max-height:45vh;overflow:auto;margin:0;padding:10px;background:rgba(0,0,0,.85);color:#9fe8c0;font:12px/1.4 monospace;white-space:pre-wrap;border:1px solid #2de2d0;border-radius:6px';
  document.body.appendChild(debugBox);
  for (const level of ['log', 'info', 'warn', 'error']) {
    const orig = console[level].bind(console);
    console[level] = (...args) => { orig(...args); dlog(level.toUpperCase(), ...args); };
  }
  window.addEventListener('error', (e) => dlog('ERROR', e.message));
  window.addEventListener('unhandledrejection', (e) => dlog('PROMISE', e.reason?.name, e.reason?.message || e.reason));
}
function dlog(...args) {
  if (!debugBox) return;
  const txt = args.map((a) => (a instanceof Error ? `${a.name}: ${a.message}` : typeof a === 'object' ? (() => { try { return JSON.stringify(a); } catch { return String(a); } })() : String(a))).join(' ');
  debugBox.textContent += `${(performance.now() / 1000).toFixed(1)}s ${txt}\n`;
  debugBox.scrollTop = debugBox.scrollHeight;
}
dlog('secureContext', window.isSecureContext, '| iframe', window.self !== window.top, '| navigator.xr', !!navigator.xr,
  '| offerSession', !!navigator.xr?.offerSession, '| UA', navigator.userAgent);

/* --- Evita la "sesión ofrecida" automática ---
 * XR Blocks llama a navigator.xr.offerSession() al iniciarse si el navegador lo admite.
 * En Quest Browser eso deja una solicitud de sesión pendiente que puede hacer fallar la
 * solicitud del botón "Comienza tu viaje". Se oculta solo para esta página. */
if (navigator.xr && navigator.xr.offerSession) {
  try { Object.defineProperty(navigator.xr, 'offerSession', {value: undefined, configurable: true, writable: true}); dlog('offerSession desactivado'); }
  catch (e) { dlog('No se pudo desactivar offerSession', e); }
}

const options = new xb.Options();
options.enableVR();                              // sesión immersive-vr (no passthrough)
options.xrButton.enabled = false;                // botón propio: "Comienza tu viaje"
options.controllers.visualizeRays = true;        // rayo visible desde los mandos
options.simulator.instructions.enabled = false;
options.referenceSpaceType = 'local-floor';
// Meta Quest Browser rechaza la sesión ("NotSupportedError: The specified session configuration
// is not supported") con la lista por defecto de XR Blocks (local-floor, bounded-floor, unbounded).
// La experiencia solo usa 'local-floor', así que se pide únicamente ese espacio de referencia.
options.webxrOptionalFeatures = ['local-floor'];
options.permissions.microphone = false;          // nunca se usa el micrófono

class SessionHooks extends xb.Script {
  onXRSessionStarted() { dlog('Sesión XR iniciada'); starting = false; landing.classList.add('hidden'); app.begin(); }
  onXRSessionEnded() { dlog('Sesión XR terminada'); starting = false; app.stop(); landing.classList.remove('hidden'); startBtn.disabled = false; }
}
const app = new Liquen();
xb.add(app);
xb.add(new SessionHooks());
try { await xb.init(options); dlog('XR Blocks listo'); }
catch (e) { console.warn('[LIQUEN] Inicialización parcial (p. ej., recurso del simulador de escritorio):', e); }
try { xb.core.renderer.xr.setFoveation?.(1); } catch (e) { /* opcional */ }

const mgr = xb.core.webXRSessionManager;
const xrSupported = !!mgr?.isXRSupported?.();
dlog('immersive-vr soportado', xrSupported);

// Si la solicitud de sesión falla, se registra el motivo y el botón queda listo para reintentar.
let starting = false;
mgr?.addEventListener?.('sessionerror', (e) => {
  starting = false; startBtn.disabled = false;
  console.warn('[LIQUEN] Error al iniciar la sesión XR:', e.error?.name, e.error?.message || e.error);
});

// El botón se activa en cuanto XR Blocks está listo; los recursos siguen cargando en segundo plano
// (una narración que aún no haya cargado simplemente no suena; el cielo aparece cuando llega).
startBtn.disabled = false;
app.preload().then(() => dlog('Recursos cargados')).catch((e) => console.warn('[LIQUEN] Precarga incompleta', e));

startBtn.addEventListener('click', () => {
  if (starting) return;
  // 1) Primero la sesión XR: requestSession debe ocurrir dentro del gesto del usuario.
  if (xrSupported && mgr && !mgr.currentSession) {
    try { starting = true; startBtn.disabled = true; mgr.startSession(); dlog('Solicitando sesión XR…'); }
    catch (e) { starting = false; startBtn.disabled = false; console.warn('[LIQUEN] No se pudo iniciar WebXR:', e?.message || e); }
  }
  // 2) Después el audio, protegido para que un error nunca bloquee la entrada.
  try { app.audio.unlock(); } catch (e) { console.warn('[LIQUEN] Audio no disponible', e); }
  // 3) Sin WebXR (escritorio): simulador de XR Blocks.
  if (!xrSupported) { landing.classList.add('hidden'); app.begin(); }
});
</script>
